# Axiom Pipeline Configuration

data:
  default_limit: 10000
  split_seed: 42
  train_ratio: 0.8
  val_ratio: 0.1
  cache_path: "axiom/data/universe_cache.json"

dsp:
  waveform_length: 256
  sample_rate_hz: 1000.0  # Hz
  noise_amplitude: 0.1
  pulse_period_range: [1.0, 10.0]  # seconds
  pulse_width_fraction: 0.05
  rfi_channels: [50, 120, 200]

models:
  random_seed: 42
  
  cnn:
    epochs: 15
    batch_size: 64
    learning_rate: 0.001
    filters: [16, 32, 64]
    dropout: 0.3
    
  random_forest:
    n_estimators: 100
    max_depth: 12
    min_samples_split: 5
    
  density:
    flow_layers: 4
    hidden_dim: 128
    learning_rate: 0.005
    epochs: 10
    
stats:
  conformal_alpha: 0.05  # Significance level (max 5% false alarm rate)
  lyapunov_embedding_dim: 5
  lyapunov_delay: 2
  bh_fdr_alpha: 0.05     # False Discovery Rate threshold
