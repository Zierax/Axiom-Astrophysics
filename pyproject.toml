[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-astrophysics"
version = "2.1.0"
description = "Multi-Layer Cosmic Signal Audit Engine — OOD Anomaly Detection for Radio Astronomy"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dl = [
    "torch>=1.10.0",
]
test = [
    "pytest>=7.0.0",
]
waterfall = [
    # Reading real filterbank (.fil) dynamic spectra for the Lane-1 manifold.
    "blimpy>=2.0.0",
]
h5 = [
    # Kaggle SETI .gpuspec spectrogram ingestion.
    "h5py>=3.0.0",
    "openpyxl>=3.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["axiom*"]

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["Axiom_C", "docs", "scripts/legacy"]

[tool.ruff.lint]
# Correctness-focused rule set (pyflakes + a subset of pycodestyle/bugbear).
# Style-only noise is intentionally excluded so CI blocks on real defects.
select = ["E9", "F", "B", "I"]
ignore = [
    "E501",  # line length handled by the formatter, not a correctness issue
    "B008",  # function calls in argument defaults (used intentionally)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
